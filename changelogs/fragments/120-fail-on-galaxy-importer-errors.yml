breaking_changes:
  - >-
    certification-reusable - the build-import job now fails when
    galaxy-importer reports errors (e.g. missing plugin documentation
    detected by ansible-doc) instead of silently passing.
    Collections with undocumented plugins that previously passed
    certification will now fail. To fix, add ``DOCUMENTATION``
    blocks or sidecar YAML documentation files for all plugins.
    Run ``ansible-doc --type <plugin_type> <fqcn>`` locally to
    verify each plugin's documentation renders correctly
    (https://github.com/ansible-collections/partner-certification-checker/issues/120).
