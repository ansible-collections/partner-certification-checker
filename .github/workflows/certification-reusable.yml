---
# Ansible collection certification reusable workflow.
# Contains pinned versions of tests for certified
# collections on Automation Hub.
# This workflow is managed by Red Hat and can be
# called by certification.yml or another workflow.
name: "Run versioned collection certification checks"

permissions:
  contents: read

env:
  GALAXY_IMPORTER_VER: "0.4.31"
  ANSIBLE_LINT_VER: "24.12.2"
  ANSIBLE_LINT_CORE_2_19_VER: "25.2.0"

on:
  workflow_call:
    inputs:
      ansible-core-version:
        description: >-
          ansible-core version to use for build-import and lint jobs
          (e.g. 2.16.0). Sanity tests use a fixed matrix of ansible-core
          stable branches and are not affected by this input.
        required: false
        default: "2.16.0"
        type: string
      origin-python-version:
        description: >-
          Python version for the GitHub Actions runner environment
          (e.g. "3.12"). Downstream Execution Environments use Python 3.12.
          It is not recommended to change this input.
        required: false
        default: "3.12"
        type: string
      collection-root:
        description: >-
          Relative path to the collection root in the repository.
          This input should only be used when the collection is
          in a non standard location (not at the root of the
          repository).
        default: "."
        type: string
      collection-deps:
        description: >-
          Specify collection dependencies to install during sanity checks.
          The workflow does not automatically install dependencies from galaxy.yml
          or requirements.yml. You can specify multiple collections separated
          with spaces; for example, "kubernetes.core amazon.aws".
        default: ""
        type: string
      automation-hub:
        type: boolean
        description: >-
          Configure Red Hat Ansible Automation Hub as a Galaxy server
          for ansible-galaxy to use when installing collections.
          The 'AH_TOKEN' secret must be provided when using this input.
        default: false
    secrets:
      AH_TOKEN:
        description: >-
          Token used to authenticate with Red Hat Ansible Automation Hub.
          Use the 'AH_TOKEN' secret when the automation-hub input boolean is true.
        required: false

jobs:
  # Build the collection and run galaxy-importer on it
  # skipping ansible-lint as it runs as a separate job
  build-import:
    name: "Build & import collection"
    env:
      CHECK_REQUIRED_TAGS: "True"
      RUN_ANSIBLE_LINT: "False"
      CORE_VER: ${{ inputs.ansible-core-version }}
      COLLECTION_ROOT: ${{ inputs.collection-root }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.origin-python-version }}

      - name: Install ansible-core
        run: pip install ansible-core=="${CORE_VER}"

      - name: Install distlib required by ansible-galaxy build
        run: pip install "distlib>=0.3.9"

      - name: Install galaxy-importer
        shell: bash
        run: pip install galaxy-importer=="${GALAXY_IMPORTER_VER}"

      - name: Update galaxy-importer.cfg
        shell: bash
        run: |
          cat > /tmp/galaxy-importer.cfg << EOF
          [galaxy-importer]
          CHECK_REQUIRED_TAGS=${{ env.CHECK_REQUIRED_TAGS }}
          RUN_ANSIBLE_LINT=${{ env.RUN_ANSIBLE_LINT }}
          EOF

          echo "GALAXY_IMPORTER_CONFIG=/tmp/galaxy-importer.cfg" >> "${GITHUB_ENV}"

      - name: Configure Red Hat Ansible Automation Hub
        if: ${{ inputs.automation-hub }}
        uses: ansible-collections/partner-certification-checker/.github/actions/configure-automation-hub@6842bb15f8930bcb04e2b4d50bb4348d0040955f
        with:
          ah-token: ${{ secrets.AH_TOKEN }} # zizmor: ignore[secrets-outside-env]

      - name: Build the collection tarball and run galaxy importer on it
        shell: bash
        run: python -m galaxy_importer.main --git-clone-path "${COLLECTION_ROOT}" --output-path /tmp

  # Run ansible-lint with profile "production"
  lint:
    name: "Lint production"
    runs-on: ubuntu-latest
    env:
      CORE_VER: ${{ inputs.ansible-core-version }}
      COLLECTION_ROOT: ${{ inputs.collection-root }}
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.origin-python-version }}

      # The default ansible-lint version is incompatible with ansible-core >= 2.19
      # because ansible.parsing.yaml.constructor was removed.
      # Use the ansible-core 2.19+ ansible-lint version for those runs.
      - name: Determine compatible ansible-lint version based on ansible-core version
        run: |
          major_minor=$(echo "${CORE_VER}" | cut -d. -f1,2)
          minor=$(echo "${major_minor}" | cut -d. -f2)
          if [ "${minor}" -ge 19 ]; then
            echo "ANSIBLE_LINT_VER=${ANSIBLE_LINT_CORE_2_19_VER}" >> "${GITHUB_ENV}"
          fi

      - name: Install ansible-lint and ansible-core
        run: pip install ansible-lint=="${ANSIBLE_LINT_VER}" ansible-core=="${CORE_VER}"

      - name: Install distlib required by ansible-galaxy build
        run: pip install "distlib>=0.3.9"

      - name: Configure Red Hat Ansible Automation Hub
        if: ${{ inputs.automation-hub }}
        uses: ansible-collections/partner-certification-checker/.github/actions/configure-automation-hub@6842bb15f8930bcb04e2b4d50bb4348d0040955f
        with:
          ah-token: ${{ secrets.AH_TOKEN }} # zizmor: ignore[secrets-outside-env]

      - name: Run ansible-lint
        # We must change directory first prior to running ansible-lint
        # if a collection root other than the default has been provided.
        # If we do not, ansible-lint does not install the collection itself.
        # Using --project-dir or passing the relative path to the collection
        # as the positional argument do not work.
        run: |
          if [ "${COLLECTION_ROOT}" != "." ]; then
            echo "Changing directory based on collection root ${COLLECTION_ROOT}"
            cd "${COLLECTION_ROOT}"
          fi
          ansible-lint --profile=production

  # Run sanity checks against the collection
  sanity:
    name: Sanity (Ⓐ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ansible:
          # Ansible Core versions aligned with Downstream Execution Environments.
          - stable-2.16
          - stable-2.18
          - stable-2.20

    steps:
      - name: Configure Red Hat Ansible Automation Hub
        if: ${{ inputs.automation-hub }}
        uses: ansible-collections/partner-certification-checker/.github/actions/configure-automation-hub@6842bb15f8930bcb04e2b4d50bb4348d0040955f
        with:
          ah-token: ${{ secrets.AH_TOKEN }} # zizmor: ignore[secrets-outside-env]

      # Run sanity tests inside a Docker container.
      # The docker container has all the pinned dependencies that are
      # required and all Python versions Ansible supports.
      - name: Perform sanity testing
        # See the documentation for the following GitHub action on
        # https://github.com/ansible-community/ansible-test-gh-action/blob/main/README.md
        uses: ansible-community/ansible-test-gh-action@9cdbd323f59530c0f43669f1168c8ef4a8c06d41
        with:
          ansible-core-version: ${{ matrix.ansible }}
          origin-python-version: ${{ inputs.origin-python-version }}
          testing-type: sanity
          test-deps: ${{ inputs.collection-deps }}
          collection-root: ${{ inputs.collection-root }}
          pull-request-change-detection: false
