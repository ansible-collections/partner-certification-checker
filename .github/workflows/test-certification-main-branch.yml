---
# This workflow runs the calling workflow from the main branch
# in this repository for testing purposes.
name: (main) Run collection certification checks

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: cert-ver-main-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Test with the default ansible-core version (currently 2.16.0).
  # Sanity tests automatically run against stable-2.16, 2.18, and 2.20.
  call-default:
    uses: ./.github/workflows/certification-reusable.yml # zizmor: ignore[self-repository]

  # Test build-import and lint with ansible-core 2.18.x
  call-2-18:
    uses: ./.github/workflows/certification-reusable.yml # zizmor: ignore[self-repository]
    with:
      ansible-core-version: '2.18.0'

  # Test build-import and lint with ansible-core 2.20.x
  call-2-20:
    uses: ./.github/workflows/certification-reusable.yml # zizmor: ignore[self-repository]
    with:
      ansible-core-version: '2.20.0'

  # Test when the collection root is not at the root of the repository
  call-collection-root:
    uses: ./.github/workflows/certification-reusable.yml # zizmor: ignore[self-repository]
    with:
      collection-root: "tests/fixtures/collection"

  # Test auto-detection of requires_ansible filtering.
  # The fixture declares >=2.18.0 so stable-2.16 should be skipped.
  call-auto-detect-min-218:
    uses: ./.github/workflows/certification-reusable.yml # zizmor: ignore[self-repository]
    with:
      ansible-core-version: '2.18.0'
      collection-root: "tests/fixtures/collection_min_218"

  # Test skipping a single sanity version
  call-skip-sanity-2-16:
    uses: ./.github/workflows/certification-reusable.yml # zizmor: ignore[self-repository]
    with:
      ansible-core-version: '2.18.0'
      skip-sanity-versions: 'stable-2.16'

  # Test skipping multiple sanity versions
  call-skip-sanity-2-16-2-18:
    uses: ./.github/workflows/certification-reusable.yml # zizmor: ignore[self-repository]
    with:
      ansible-core-version: '2.20.0'
      skip-sanity-versions: 'stable-2.16 stable-2.18'

  # Test installation of collection dependency
  call-collection-deps:
    uses: ./.github/workflows/certification-reusable.yml # zizmor: ignore[self-repository]
    with:
      collection-deps: "kubernetes.core"

  # Test installation of multiple collection dependencies
  call-multiple-collection-deps:
    uses: ./.github/workflows/certification-reusable.yml # zizmor: ignore[self-repository]
    with:
      collection-deps: "kubernetes.core amazon.aws ansible.mcp"

  # Regression test: build-import must detect galaxy-importer errors
  # for collections with undocumented plugins (issue #120).
  # Cannot call the reusable workflow here because GitHub Actions
  # does not support continue-on-error on reusable workflow calls,
  # so we replicate the build-import error detection directly.
  test-build-import-error-detection:
    name: "Test: build-import detects missing docs (#120)"
    runs-on: ubuntu-latest
    env:
      GALAXY_IMPORTER_VER: "0.4.39"
      CORE_VER: "2.16.19"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: >-
          pip install
          ansible-core=="${CORE_VER}"
          "distlib>=0.3.9"
          galaxy-importer=="${GALAXY_IMPORTER_VER}"

      - name: Run galaxy-importer on fixture with missing docs
        shell: bash
        run: |
          python -m galaxy_importer.main \
            --git-clone-path "tests/fixtures/collection_missing_docs" \
            --output-path /tmp 2>&1 | tee /tmp/galaxy-importer.log

      - name: Verify error detection catches missing documentation
        shell: bash
        run: |
          if ! grep -q '^ERROR:' /tmp/galaxy-importer.log; then
            echo "::error::Expected galaxy-importer to report errors for missing plugin documentation"
            exit 1
          fi
          echo "Confirmed: error detection correctly catches missing documentation"
          grep '^ERROR:' /tmp/galaxy-importer.log
